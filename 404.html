<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — ARIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#05081a;--teal:#4a9aa5;--cyan:#71bcc8;--ink:#e9f2f2;--ink-dim:#9fb3b5;}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);color:var(--ink);font-family:'Inter',sans-serif;text-align:center;padding:24px;}
  .wrap{max-width:480px;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:2.4rem;margin:0 0 12px;background:linear-gradient(90deg,var(--cyan),var(--teal));-webkit-background-clip:text;background-clip:text;color:transparent;}
  p{color:var(--ink-dim);margin:0 0 24px;line-height:1.6;}
  a{display:inline-block;background:var(--teal);color:#03151a;text-decoration:none;font-family:'Space Grotesk',sans-serif;font-weight:600;padding:12px 24px;border-radius:8px;}
</style>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>That page doesn't exist. It may have moved, or the link was mistyped.</p>
    <a href="/">Back to homepage</a>
  </div>
</body>
</html>
